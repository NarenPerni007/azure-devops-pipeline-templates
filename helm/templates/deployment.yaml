apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-webapp.fullname" . }}
  labels:
    {{- include "sample-webapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sample-webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-webapp.selectorLabels" . | nindent 8 }}
      {{- if .Values.dynatrace.enabled }}
      annotations:
        # Dynatrace Operator injects OneAgent into annotated pods for deep monitoring.
        dynatrace.com/inject: {{ .Values.dynatrace.injectAnnotation | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
